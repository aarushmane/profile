<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Site.Params.description }}">
    <title>{{ if .IsHome }}{{ .Site.Title }} | Portfolio{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    {{ $styles := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $styles.RelPermalink }}">
</head>
<body>
    <header class="site-nav">
        <a class="brand" href="{{ "/" | relURL }}"><span class="brand-mark">AM</span><span>Aarush Mane</span></a>
        <nav aria-label="Main navigation">
            <a href="{{ "/" | relURL }}#about">About</a>
            <a href="{{ "/" | relURL }}#projects">Projects</a>
            <a href="{{ "/" | relURL }}#research">Research</a>
            <a href="{{ "/" | relURL }}#civic-service">Civic Service</a>
        </nav>
        <div class="nav-actions">
            <a class="nav-icon" href="{{ .Site.Params.github_url }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            </a>
            <a class="nav-icon" href="{{ .Site.Params.linkedin_url }}" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            </a>
            <a class="nav-icon" href="{{ .Site.Params.ieee_url }}" target="_blank" rel="noopener noreferrer" aria-label="IEEE Xplore" title="IEEE Xplore">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path><path d="M9 7h6"></path><path d="M9 11h6"></path></svg>
            </a>
            <a class="nav-icon" href="{{ .Site.Params.resume_url_en | relURL }}" target="_blank" aria-label="Download resume" title="Download resume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </a>
        </div>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer"><span>© {{ now.Year }} Aarush Mane</span><span>Computer Science · Princeton University</span></footer>
    <script src="{{ "js/home.js" | relURL }}" defer></script>
</body>
</html>
