{{ $home := .Site.Home.RelPermalink }}
{{ with .Params.media }}
<section class="work-gallery" aria-label="{{ $.Title }} gallery" aria-roledescription="carousel">
    <div class="work-gallery-slides">
        {{ $ordered := (where . "type" "video") | append (where . "type" "ne" "video") }}
        {{ range $index, $media := $ordered }}
        <figure class="work-gallery-slide" {{ if $index }}hidden{{ end }} aria-label="{{ add $index 1 }} of {{ len $.Params.media }}" aria-roledescription="slide">
            {{ if eq .type "video" }}
            <video controls muted playsinline preload="none" aria-label="{{ .alt }}">
                <source src="{{ $home }}{{ .src }}" type="video/mp4">
            </video>
            {{ else }}
            <a href="{{ $home }}{{ .src }}" target="_blank" rel="noopener noreferrer"><img src="{{ $home }}{{ .src }}" alt="{{ .alt }}" loading="lazy"></a>
            {{ end }}
            <figcaption>{{ .caption | default .alt }}</figcaption>
        </figure>
        {{ end }}
    </div>
    {{ if gt (len .) 1 }}
    <div class="work-gallery-controls" hidden>
        <button type="button" data-gallery-previous aria-label="Previous slide">←</button>
        <span data-gallery-count aria-live="off">01 / {{ printf "%02d" (len .) }}</span>
        <button type="button" data-gallery-next aria-label="Next slide">→</button>
        <button type="button" data-gallery-pause aria-label="Pause automatic slides">Pause</button>
    </div>
    {{ end }}
</section>
{{ end }}
